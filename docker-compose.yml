name: chip-tray-inspection

services:
  api:
    build: .
    image: chip-tray-inspection-api
    ports:
      # Host port is overridable: API_PORT=9000 docker compose up
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot acceptance service. It is not started by a plain
  # `docker compose up`; run it explicitly with:
  #   docker compose --profile verify up --build --abort-on-container-exit --exit-code-from verify
  verify:
    build: .
    image: chip-tray-inspection-api
    profiles: ["verify"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    command: ["python", "-m", "verify.verify"]
